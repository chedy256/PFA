version: "3.9"

services:
  backend:
    build: .
    container_name: internship-backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./firebase.json:/app/firebase.json:ro
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/internships
      DOCUMENTS_PATH: /app/storage/internships
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: internship-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: internships
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
